# Copy to configs/config.yaml (git-ignored) and edit. Every key is optional.
# Relative paths are resolved against the project root, not the working directory.
# Precedence: runtime overrides > environment variables > this file > defaults.

app:
  name: FlawBench
  environment: development      # development | production
  log_level: INFO               # DEBUG | INFO | WARNING | ERROR | CRITICAL

storage:
  reference_dir: data/reference # read-only input location
  generated_dir: data/generated # writable
  metadata_dir: data/metadata   # writable
  output_dir: outputs           # writable; reports/ and figures/ live beneath it

audio:
  allowed_extensions: [".wav", ".flac", ".ogg", ".mp3"]
  max_upload_mb: 50
  min_sample_rate_hz: 8000
  max_channels: 2
  reject_non_finite_samples: true

ui:
  page_title: "FlawBench - Speech Flaw Analysis"
  layout: wide                  # centered | wide
  show_roadmap: true

diagnostics:
  detailed_logging: false       # include tracebacks in logs
  expose_error_details: false   # show technical detail in the UI (rejected in production)

dataset:
  dataset_id: flawbench-v1          # namespace for generated audio and sample ids
  # Metadata files live inside storage.metadata_dir (plain file names only).
  sources_filename: sources.jsonl
  manifest_filename: manifest.jsonl
  runs_filename: runs.jsonl
  splits_filename: splits.json
  copy_reference: false             # true: `register-reference` may copy files into reference_dir
  allow_overwrite: false            # true: regeneration may replace an existing sample (history kept)
  output_subtype: FLOAT             # FLOAT (lossless for the float32 pipeline) | PCM_16 | PCM_24
  placement_margin_sec: 0.25        # random placement stays this far from the recording edges
  max_output_seconds: 600.0         # refuse to generate longer recordings
  max_variants_per_run: 1000
  duration_tolerance_sec: 0.001     # validator tolerance between recorded and actual duration
  split_seed: 1337
  split_ratios: {train: 0.7, validation: 0.15, test: 0.15}
  # Experimental manipulation strengths, NOT human-rated severities. Mapping settings in a file
  # (or in the environment) replace the default mapping wholesale.
  severity_profiles:
    pause_insertion:
      low:    {duration_sec: 0.5}
      medium: {duration_sec: 1.0}
      high:   {duration_sec: 2.0}
    tempo_change:                   # rate < 1 slows the segment, > 1 speeds it up
      low:    {rate: 0.85, segment_sec: 2.0}
      medium: {rate: 0.7,  segment_sec: 2.0}
      high:   {rate: 0.5,  segment_sec: 2.0}
    energy_reduction:               # negative gain in dB applied to the segment
      low:    {gain_db: -6.0,  segment_sec: 2.0}
      medium: {gain_db: -12.0, segment_sec: 2.0}
      high:   {gain_db: -24.0, segment_sec: 2.0}
  parameter_bounds:
    pause_insertion:
      duration_sec: {min: 0.05, max: 30.0}
    tempo_change:
      rate: {min: 0.25, max: 4.0}
      segment_sec: {min: 0.25, max: 30.0}
    energy_reduction:
      gain_db: {min: -60.0, max: -0.5}
      segment_sec: {min: 0.05, max: 30.0}

features:
  frame_ms: 25.0
  hop_ms: 10.0
  n_mfcc: 13
  spectral_rolloff_p: 0.85
  pitch_backend: librosa_pyin
  f0_min_hz: 75.0
  f0_max_hz: 600.0
  channel_policy: mono_mix
  silence_threshold_db: -40.0
  min_silence_ms: 50.0
  features_dir: data/features
  feature_manifest_filename: feature_manifest.jsonl
  cache_policy: skip_if_valid
  max_feature_seconds: 600.0
  schema_version: "3.0"

detection:
  enabled_detectors: ["pause_insertion", "tempo_change", "energy_reduction"]
  pause_silence_threshold_db: -35.0
  pause_min_duration_sec: 0.15
  pause_min_difference_sec: 0.10
  tempo_ratio_min_deviation: 0.15
  tempo_min_duration_sec: 0.25
  alignment_metric: euclidean     # DTW metric used for detection alignment (euclidean | cosine)
  alignment_exclude_energy_coefficient: true  # drop MFCC c0 so alignment does not depend on loudness
  tempo_slope_window_sec: 0.5     # time window used to estimate local DTW warp slope
  tempo_max_inactive_fraction: 0.2 # windows with more silent frames than this give no tempo evidence
  pause_max_voiced_fraction: 0.25 # a pause candidate may contain at most this fraction of voiced frames
  energy_reduction_threshold_db: -4.0
  energy_reduction_min_duration_sec: 0.15
  merge_gap_sec: 0.05
  min_candidate_duration_sec: 0.08
  detection_dir: data/detections
  detection_manifest_filename: detections_manifest.jsonl
  cache_policy: skip_if_valid
  schema_version: "4.0"

evaluation:
  default_split: test              # test | validation | train | all
  matching_iou_threshold: 0.5      # minimum IoU for temporal match credit
  localization_iou_thresholds: [0.3, 0.5, 0.7, 0.9] # localization curve steps
  require_category_match: true     # category agreement required for precision/recall
  zero_denominator_policy: undefined # undefined | zero
  bootstrap_replicates: 0          # 0 disables bootstrap confidence intervals
  bootstrap_seed: 1337
  include_identity_controls: true  # run clean audio false-positive checks
  evaluations_dir: outputs/evaluations
  evaluations_manifest_filename: evaluations_manifest.jsonl
  schema_version: "5.0"

explanation:
  default_page: overview             # overview | analyze | timeline | evidence | guidance | evaluation | technical
  analysis_modes: ["registered_variant", "uploaded_participant"]
  verbosity: standard                # concise | standard | detailed
  sort_policy: chronological         # chronological | evidence_strength
  playback_context_sec: 1.0          # context before/after a flagged interval in excerpts
  max_excerpt_sec: 30.0              # upper bound on a single playback excerpt
  show_technical_evidence: true
  transcript_formats: [".txt"]       # .txt | .md
  transcript_similarity_warning: 0.8 # warn when word-sequence similarity falls below this
  alignment_duration_ratio_warning: 2.0 # warn when recording lengths differ by more than this factor
  upload_persistence: explicit_registration # transient_only | explicit_registration
  reports_dir: outputs/participant_reports
  export_formats: ["markdown", "html", "json", "csv"]
  save_reports_automatically: false
  show_benchmark_context: true
