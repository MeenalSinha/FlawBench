[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flawbench"
dynamic = ["version"]
description = "FlawBench: evidence-based speech flaw analysis with exact ground truth."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24,<3",
    "soundfile>=0.12.1,<1",
    "PyYAML>=6.0,<7",
    "audiotsm>=0.1.2,<1",
    "streamlit>=1.40,<2",
    "librosa>=0.10,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
flawbench = "flawbench.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "flawbench.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/flawbench", "app.py"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
